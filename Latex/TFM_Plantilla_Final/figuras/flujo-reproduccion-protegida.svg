<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de reproducción protegido</title>
  <desc id="desc">Diagrama de secuencia simplificado del login, la sesión, el manifest y la licencia Widevine.</desc>
  <defs>
    <marker id="arrow-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333333"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111111; }
      .actor { fill: #F7F7F7; stroke: #3F3F3F; stroke-width: 1.5; }
      .lifeline { stroke: #C7C7C7; stroke-width: 1.1; stroke-dasharray: 7 6; }
      .message { stroke: #333333; stroke-width: 1.5; fill: none; marker-end: url(#arrow-s); }
      .actor-text { font-size: 22px; font-weight: 700; }
      .step { font-size: 21px; font-weight: 700; }
      .detail { font-size: 19px; font-weight: 400; fill: #333333; }
      .number { font-size: 20px; font-weight: 700; }
      .number-circle { fill: #FFFFFF; stroke: #3F3F3F; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="780" fill="#FFFFFF"/>

  <g aria-label="Actores">
    <rect class="actor" x="60" y="25" width="180" height="62" rx="3"/>
    <rect class="actor" x="285" y="25" width="180" height="62" rx="3"/>
    <rect class="actor" x="510" y="25" width="210" height="62" rx="3"/>
    <rect class="actor" x="760" y="25" width="190" height="62" rx="3"/>
    <rect class="actor" x="985" y="25" width="190" height="62" rx="3"/>
    <text class="actor-text" x="150" y="64" text-anchor="middle">Cliente OTT</text>
    <text class="actor-text" x="375" y="64" text-anchor="middle">Varnish</text>
    <text class="actor-text" x="615" y="64" text-anchor="middle">Control-plane</text>
    <text class="actor-text" x="855" y="64" text-anchor="middle">Proxy licencia</text>
    <text class="actor-text" x="1080" y="64" text-anchor="middle">Widevine / CDM</text>
    <line class="lifeline" x1="150" y1="87" x2="150" y2="752"/>
    <line class="lifeline" x1="375" y1="87" x2="375" y2="752"/>
    <line class="lifeline" x1="615" y1="87" x2="615" y2="752"/>
    <line class="lifeline" x1="855" y1="87" x2="855" y2="752"/>
    <line class="lifeline" x1="1080" y1="87" x2="1080" y2="752"/>
  </g>

  <g aria-label="Paso 1, autenticación">
    <circle class="number-circle" cx="30" cy="138" r="19"/>
    <text class="number" x="30" y="145" text-anchor="middle">1</text>
    <path class="message" d="M150 140 H608"/>
    <text class="step" x="382" y="126" text-anchor="middle">POST /auth/login</text>
    <text class="detail" x="382" y="163" text-anchor="middle">correo · contraseña · deviceId</text>
    <path class="message" d="M615 200 H157"/>
    <text class="step" x="382" y="188" text-anchor="middle">Access token (3600 s)</text>
    <text class="detail" x="382" y="223" text-anchor="middle">identidad · dispositivo · entitlement · rol en Fase 2</text>
  </g>

  <g aria-label="Paso 2, sesión de reproducción">
    <circle class="number-circle" cx="30" cy="270" r="19"/>
    <text class="number" x="30" y="277" text-anchor="middle">2</text>
    <path class="message" d="M150 270 H608"/>
    <text class="step" x="382" y="257" text-anchor="middle">POST /playback/session</text>
    <text class="detail" x="382" y="292" text-anchor="middle">access token · assetId</text>
    <path class="message" d="M615 330 H157"/>
    <text class="step" x="382" y="318" text-anchor="middle">Playback token (90 s)</text>
    <text class="detail" x="382" y="353" text-anchor="middle">sessionId · assetId · deviceId · scopes</text>
  </g>

  <g aria-label="Paso 3, manifest">
    <circle class="number-circle" cx="30" cy="400" r="19"/>
    <text class="number" x="30" y="407" text-anchor="middle">3</text>
    <path class="message" d="M150 400 H608"/>
    <text class="step" x="382" y="387" text-anchor="middle">GET /manifest/:assetId</text>
    <text class="detail" x="382" y="422" text-anchor="middle">Bearer · X-Playback-Session-Id · X-Device-Id</text>
    <path class="message" d="M615 460 H157"/>
    <text class="step" x="382" y="448" text-anchor="middle">MPD DASH autorizado</text>
    <text class="detail" x="382" y="483" text-anchor="middle">binding de sesión y activo · BaseURL del medio</text>
  </g>

  <g aria-label="Paso 4, licencia y reproducción">
    <circle class="number-circle" cx="30" cy="530" r="19"/>
    <text class="number" x="30" y="537" text-anchor="middle">4</text>
    <path class="message" d="M150 530 H848"/>
    <text class="step" x="500" y="517" text-anchor="middle">POST /license</text>
    <text class="detail" x="500" y="552" text-anchor="middle">challenge binario con el contexto de reproducción</text>
    <path class="message" d="M855 590 H1073"/>
    <text class="step" x="966" y="578" text-anchor="middle">/internal/license</text>
    <text class="detail" x="966" y="613" text-anchor="middle">solo red Docker</text>
    <path class="message" d="M1080 645 H862"/>
    <text class="step" x="973" y="633" text-anchor="middle">Licencia binaria</text>
    <text class="detail" x="973" y="668" text-anchor="middle">procesada dentro del CDM</text>
    <path class="message" d="M855 710 H157"/>
    <text class="step" x="500" y="698" text-anchor="middle">Reproducción autorizada</text>
    <text class="detail" x="500" y="733" text-anchor="middle">heartbeat cada 20 s · renovación del token · sesión activa</text>
  </g>
</svg>
