<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura defensiva por capas, opción A</title>
  <desc id="desc">Representación vertical y monocromática de las capas de cliente, perímetro, estado y medios.</desc>
  <defs>
    <marker id="arrow-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333333"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111111; }
      .box { stroke: #3F3F3F; stroke-width: 1.5; }
      .divider { stroke: #B7B7B7; stroke-width: 1.2; }
      .connector { stroke: #333333; stroke-width: 1.5; fill: none; marker-end: url(#arrow-a); }
      .category { font-size: 21px; font-weight: 700; letter-spacing: 0.4px; }
      .heading { font-size: 28px; font-weight: 700; }
      .body { font-size: 23px; font-weight: 400; }
      .phase { font-size: 20px; font-weight: 700; }
      .phase-note { font-size: 20px; font-weight: 400; }
      .note { font-size: 21px; font-weight: 400; fill: #333333; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#FFFFFF"/>

  <g aria-label="Capa de cliente">
    <rect class="box" x="70" y="30" width="950" height="120" rx="3" fill="#FFFFFF"/>
    <line class="divider" x1="285" y1="30" x2="285" y2="150"/>
    <text class="category" x="177" y="96" text-anchor="middle">CLIENTE</text>
    <text class="heading" x="320" y="72">Interfaz y reproducción</text>
    <text class="body" x="320" y="112">Cliente OTT · laboratorio · Shaka Player · EME/CDM · watermark</text>
  </g>

  <path class="connector" d="M545 150 V184"/>

  <g aria-label="Capa de perímetro">
    <rect class="box" x="70" y="190" width="950" height="120" rx="3" fill="#F7F7F7"/>
    <line class="divider" x1="285" y1="190" x2="285" y2="310"/>
    <text class="category" x="177" y="256" text-anchor="middle">PERÍMETRO</text>
    <text class="heading" x="320" y="228">Varnish y plano de control</text>
    <text class="body" x="320" y="266">Rutas permitidas · CORS · IP fiable · autenticación · entitlement</text>
    <text class="body" x="320" y="296">Sesión activa · binding de cuenta, dispositivo, activo y sesión</text>
    <line class="divider" x1="1020" y1="250" x2="1042" y2="250"/>
    <text class="phase" x="1055" y="242">FASE 1</text>
    <text class="phase-note" x="1055" y="270">Prevención</text>
  </g>

  <path class="connector" d="M545 310 V344"/>

  <g aria-label="Capa de estado">
    <rect class="box" x="70" y="350" width="950" height="120" rx="3" fill="#FFFFFF"/>
    <line class="divider" x1="285" y1="350" x2="285" y2="470"/>
    <text class="category" x="177" y="416" text-anchor="middle">ESTADO</text>
    <text class="heading" x="320" y="388">Sesiones, telemetría y decisión</text>
    <text class="body" x="320" y="426">Fase 1: memoria y límites preventivos</text>
    <text class="body" x="320" y="456">Fase 2: Redis · eventos · contadores · score · bans</text>
    <line class="divider" x1="1020" y1="410" x2="1042" y2="410"/>
    <text class="phase" x="1055" y="402">FASE 2</text>
    <text class="phase-note" x="1055" y="430">Detección</text>
    <text class="phase-note" x="1055" y="456">y respuesta</text>
  </g>

  <path class="connector" d="M545 470 V504"/>

  <g aria-label="Capa de medios">
    <rect class="box" x="70" y="510" width="950" height="120" rx="3" fill="#F7F7F7"/>
    <line class="divider" x1="285" y1="510" x2="285" y2="630"/>
    <text class="category" x="177" y="576" text-anchor="middle">MEDIOS</text>
    <text class="heading" x="320" y="548">Distribución y DRM</text>
    <text class="body" x="320" y="586">Origin interno · MPD DASH · segmentos CENC</text>
    <text class="body" x="320" y="616">Proxy interno de licencias · Widevine · CDM</text>
  </g>

  <line class="divider" x1="245" y1="690" x2="955" y2="690"/>
  <text class="note" x="600" y="724" text-anchor="middle">La petición solo alcanza los servicios internos tras superar las validaciones previas.</text>
</svg>
