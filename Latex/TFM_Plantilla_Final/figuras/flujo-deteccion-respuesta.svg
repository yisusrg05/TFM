<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Flujo alternativo de detección y respuesta</title>
  <desc id="desc">Versión conceptual y resumida del flujo de señales, estado, decisión y respuesta de Fase 2.</desc>
  <defs>
    <marker id="arrow-alt" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333333"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111111; }
      .box { stroke: #3F3F3F; stroke-width: 1.5; }
      .response { stroke: #333333; stroke-width: 2; }
      .connector { stroke: #333333; stroke-width: 1.5; fill: none; marker-end: url(#arrow-alt); }
      .heading { font-size: 28px; font-weight: 700; }
      .body { font-size: 21px; font-weight: 400; }
      .note { font-size: 20px; font-weight: 400; fill: #333333; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#FFFFFF"/>

  <g aria-label="Señales">
    <rect class="box" x="35" y="60" width="240" height="250" rx="3" fill="#FFFFFF"/>
    <text class="heading" x="155" y="108" text-anchor="middle">Señales</text>
    <text class="body" x="62" y="158">Autenticación</text>
    <text class="body" x="62" y="196">Concurrencia</text>
    <text class="body" x="62" y="234">Acceso a medios</text>
    <text class="body" x="62" y="272">Heartbeat</text>
  </g>

  <path class="connector" d="M275 185 H320"/>

  <g aria-label="Estado">
    <rect class="box" x="325" y="60" width="240" height="250" rx="3" fill="#F7F7F7"/>
    <text class="heading" x="445" y="108" text-anchor="middle">Estado</text>
    <text class="body" x="352" y="158">Sesiones</text>
    <text class="body" x="352" y="196">Eventos</text>
    <text class="body" x="352" y="234">Contadores con TTL</text>
    <text class="body" x="352" y="272">Historial de riesgo</text>
  </g>

  <path class="connector" d="M565 185 H610"/>

  <g aria-label="Decisión">
    <rect class="box" x="615" y="60" width="250" height="250" rx="3" fill="#FFFFFF"/>
    <text class="heading" x="740" y="108" text-anchor="middle">Decisión</text>
    <text class="body" x="642" y="166">Reglas por señal</text>
    <text class="body" x="642" y="210">Score y razones</text>
    <text class="body" x="642" y="254">Umbral de bloqueo</text>
  </g>

  <path class="connector" d="M865 185 H910"/>

  <g aria-label="Respuesta">
    <rect class="box response" x="915" y="60" width="250" height="250" rx="3" fill="#F7F7F7"/>
    <text class="heading" x="1040" y="108" text-anchor="middle">Respuesta</text>
    <text class="body" x="942" y="158">Rechazo</text>
    <text class="body" x="942" y="196">Ban de cuenta</text>
    <text class="body" x="942" y="234">Ban de dispositivo</text>
    <text class="body" x="942" y="272">Revocación</text>
  </g>

  <path class="connector" d="M1040 310 V363 H960 V398"/>
  <path class="connector" d="M240 398 V363 H155 V317"/>

  <g aria-label="Plano administrativo">
    <rect class="box" x="190" y="398" width="820" height="125" rx="3" fill="#FFFFFF"/>
    <text class="heading" x="600" y="443" text-anchor="middle">Plano administrativo separado</text>
    <text class="body" x="600" y="486" text-anchor="middle">Consulta el estado y permite crear o retirar bloqueos.</text>
  </g>

  <line x1="235" y1="570" x2="965" y2="570" stroke="#B7B7B7" stroke-width="1.2"/>
  <text class="note" x="600" y="601" text-anchor="middle">Los umbrales concretos permanecen en la versión detallada y en la configuración.</text>
</svg>
